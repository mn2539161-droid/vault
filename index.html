<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vault Pro - Media Storage</title>
  <style>
    :root {
      --bg-color: #07090e;
      --container-bg: rgba(19, 27, 46, 0.85);
      --text-color: #f8fafc;
      --subtext-color: #94a3b8;
      --card-bg: rgba(15, 23, 42, 0.7);
      --border-color: rgba(255,255,255,0.08);
      --header-grad: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
    }

    [data-theme="light"] {
      --bg-color: #f1f5f9;
      --container-bg: rgba(255, 255, 255, 0.9);
      --text-color: #0f172a;
      --subtext-color: #64748b;
      --card-bg: rgba(241, 245, 249, 0.9);
      --border-color: rgba(0,0,0,0.08);
      --header-grad: linear-gradient(135deg, #4f46e5 0%, #9333ea 100%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', 'Segoe UI', Tahoma, sans-serif; transition: background 0.3s, color 0.3s; }
    body { background: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 15px; }
    
    .container { width: 100%; max-width: 480px; background: var(--container-bg); backdrop-filter: blur(12px); border-radius: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.7); overflow: hidden; display: flex; flex-direction: column; height: 94vh; border: 1px solid var(--border-color); animation: fadeIn 0.5s ease-in-out; }
    
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    header { background: var(--header-grad); padding: 18px 20px; display: flex; justify-content: space-between; align-items: center; color: white; box-shadow: 0 4px 15px rgba(99,102,241,0.4); }
    header h2 { font-size: 18px; font-weight: 600; letter-spacing: 0.5px; }
    .header-icons { display: flex; gap: 14px; align-items: center; }
    .icon-btn { font-size: 18px; cursor: pointer; transition: 0.3s; background: none; border: none; color: white; }
    .icon-btn:hover { transform: scale(1.15); }
    
    .nav-tabs { display: flex; background: #0b0f19; border-bottom: 1px solid var(--border-color); }
    .tab-btn { flex: 1; padding: 14px; background: none; border: none; color: var(--subtext-color); font-weight: 600; cursor: pointer; font-size: 14px; transition: 0.3s; position: relative; }
    .tab-btn.active { color: #38bdf8; background: rgba(56, 189, 248, 0.05); }
    .tab-btn.active::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 3px; background: #38bdf8; border-radius: 3px 3px 0 0; }

    .content-area { flex: 1; overflow-y: auto; padding: 18px; display: none; flex-direction: column; gap: 16px; }
    .content-area.active { display: flex; }

    .action-box { background: var(--card-bg); padding: 22px; border-radius: 16px; text-align: center; border: 2px dashed rgba(99, 102, 241, 0.3); transition: 0.3s; }
    .action-box:hover { border-color: #6366f1; }
    
    .btn { background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); color: white; border: none; padding: 13px 20px; border-radius: 12px; font-weight: 600; cursor: pointer; font-size: 14px; width: 100%; margin-top: 10px; box-shadow: 0 4px 15px rgba(99,102,241,0.3); transition: 0.2s; }
    .btn:active { transform: scale(0.97); }

    .media-grid { display: flex; flex-direction: column; gap: 12px; }
    .media-card { background: var(--card-bg); border-radius: 14px; padding: 12px; display: flex; align-items: center; justify-content: space-between; border: 1px solid var(--border-color); transition: 0.2s; animation: slideUp 0.3s ease; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    
    .media-preview { width: 65px; height: 65px; border-radius: 10px; object-fit: cover; background: #000; cursor: pointer; border: 1px solid var(--border-color); }
    
    .media-info { flex: 1; margin: 0 14px; overflow: hidden; text-align: left; }
    .media-name { font-size: 13px; font-weight: 600; color: var(--text-color); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .media-size { font-size: 11px; color: var(--subtext-color); margin-top: 3px; }

    .action-btns { display: flex; gap: 6px; }
    .btn-sm { border: none; padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .share-btn { background: #10b981; color: white; box-shadow: 0 2px 10px rgba(16,185,129,0.3); }
    .delete-btn { background: #ef4444; color: white; box-shadow: 0 2px 10px rgba(239,68,68,0.3); }

    /* MODALS */
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(7, 9, 14, 0.95); backdrop-filter: blur(10px); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
    video, img.full-preview { width: 100%; max-height: 60vh; border-radius: 16px; object-fit: contain; background: #000; border: 1px solid var(--border-color); }
    
    .modal-controls { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 320px; margin-top: 15px; }
    .timer-badge { position: absolute; top: 30px; background: rgba(239, 68, 68, 0.9); color: white; padding: 6px 18px; border-radius: 20px; font-weight: bold; font-size: 15px; display: none; box-shadow: 0 0 15px rgba(239,68,68,0.5); }

    /* SETTINGS & LOCK SCREEN */
    .settings-card, .lock-card { background: var(--container-bg); padding: 25px; border-radius: 20px; width: 90%; max-width: 360px; text-align: center; border: 1px solid var(--border-color); box-shadow: 0 15px 30px rgba(0,0,0,0.8); }
    .input-field { width: 100%; padding: 12px; background: var(--card-bg); border: 1px solid #334155; border-radius: 10px; color: var(--text-color); font-size: 16px; text-align: center; margin: 12px 0; outline: none; letter-spacing: 3px; }
    .dev-credit { font-size: 11px; color: var(--subtext-color); margin-top: 15px; border-top: 1px solid var(--border-color); padding-top: 10px; }
  </style>
</head>
<body onload="initApp()">

  <!-- LOCK SCREEN MODAL -->
  <div class="modal" id="lockModal" style="display:none; z-index: 200;">
    <div class="lock-card">
      <h3 style="color:#38bdf8; margin-bottom: 5px;">🔒 Vault Locked</h3>
      <p style="font-size: 12px; color: var(--subtext-color); margin-bottom: 15px;">Enter your 4-digit PIN to unlock</p>
      <input type="password" id="pinInput" maxlength="4" class="input-field" placeholder="••••">
      <button class="btn" onclick="verifyPin()">Unlock Vault</button>
    </div>
  </div>

  <div class="container">
    <header>
      <h2>⚡ Vault Pro</h2>
      <div class="header-icons">
        <button class="icon-btn" onclick="toggleTheme()" id="themeIcon">🌙</button>
        <button class="icon-btn" onclick="openSettings()">⚙️</button>
      </div>
    </header>

    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('photo')">📸 Photos</button>
      <button class="tab-btn" onclick="switchTab('video')">🎥 Videos</button>
    </div>

    <!-- PHOTOS TAB -->
    <div id="photoTab" class="content-area active">
      <div class="action-box">
        <p style="font-size: 13px; color: var(--subtext-color); margin-bottom: 8px;">Capture HD photos bypassing internal storage limits!</p>
        <button class="btn" onclick="openCamera('photo')">Take New Photo</button>
      </div>
      <div class="media-grid" id="photoGrid"></div>
    </div>

    <!-- VIDEOS TAB -->
    <div id="videoTab" class="content-area">
      <div class="action-box">
        <p style="font-size: 13px; color: var(--subtext-color); margin-bottom: 8px;">Record unlimited videos with crystal clear sound!</p>
        <button class="btn" onclick="openCamera('video')">Record New Video</button>
      </div>
      <div class="media-grid" id="videoGrid"></div>
    </div>
  </div>

  <!-- SETTINGS MODAL -->
  <div class="modal" id="settingsModal">
    <div class="settings-card">
      <h3 style="color:#6366f1; margin-bottom: 12px;">App Settings</h3>
      <p style="font-size: 12px; color: var(--subtext-color); text-align: left; margin-bottom: 4px;">Set 4-Digit Security PIN:</p>
      <input type="password" id="newPinInput" maxlength="4" class="input-field" placeholder="Enter 4-digit PIN">
      <button class="btn" style="background:#10b981;" onclick="savePin()">Save PIN Lock</button>
      <button class="btn" style="background:#ef4444; margin-top: 8px;" onclick="removePin()">Remove Lock</button>
      <button class="btn" style="background:#334155; margin-top: 8px;" onclick="closeSettings()">Close</button>
      <div class="dev-credit">Developed by <b>Muntashir Al Hera</b></div>
    </div>
  </div>

  <!-- CAMERA MODAL -->
  <div class="modal" id="cameraModal">
    <div class="timer-badge" id="recTimer">🔴 00:00</div>
    <video id="camView" autoplay playsinline muted></video>
    <div class="modal-controls">
      <button class="btn" id="flipBtn" style="background:#475569;" onclick="flipCamera()">🔄 Flip Camera</button>
      <button class="btn" id="captureBtn" style="background:#22c55e;" onclick="takeSnapshot()">Capture</button>
      <button class="btn" style="background:#ef4444;" onclick="closeCameraModal()">Cancel</button>
    </div>
  </div>

  <!-- FULL MEDIA VIEW MODAL -->
  <div class="modal" id="viewModal">
    <div id="viewContainer" style="width:100%; text-align:center;"></div>
    <div class="modal-controls">
      <button class="btn" style="background:#475569;" onclick="closeViewModal()">Close</button>
    </div>
  </div>

  <script>
    let db;
    let mediaStream = null;
    let currentMode = 'photo';
    let facingMode = 'user'; 
    let mediaRecorder;
    let recordedChunks = [];
    let timerInterval;
    let secondsRecorded = 0;

    // Database Initialization
    const request = indexedDB.open("VaultProDB", 1);
    request.onupgradeneeded = (e) => {
      db = e.target.result;
      if (!db.objectStoreNames.contains("files")) {
        db.createObjectStore("files", { keyPath: "id", autoIncrement: true });
      }
    };
    request.onsuccess = (e) => {
      db = e.target.result;
      loadStoredFiles();
    };

    // App Initializer & Theme Handler
    function initApp() {
      const savedTheme = localStorage.getItem('vault_theme') || 'dark';
      if(savedTheme === 'light') {
        document.body.setAttribute('data-theme', 'light');
        document.getElementById('themeIcon').innerText = '☀️';
      } else {
        document.body.removeAttribute('data-theme');
        document.getElementById('themeIcon').innerText = '🌙';
      }
      checkLock();
    }

    function toggleTheme() {
      const currentTheme = document.body.getAttribute('data-theme');
      if (currentTheme === 'light') {
        document.body.removeAttribute('data-theme');
        localStorage.setItem('vault_theme', 'dark');
        document.getElementById('themeIcon').innerText = '🌙';
      } else {
        document.body.setAttribute('data-theme', 'light');
        localStorage.setItem('vault_theme', 'light');
        document.getElementById('themeIcon').innerText = '☀️';
      }
    }

    // Lock Security Checks
    function checkLock() {
      const savedPin = localStorage.getItem('vault_pin');
      if (savedPin) {
        document.getElementById('lockModal').style.display = 'flex';
      }
    }

    function verifyPin() {
      const input = document.getElementById('pinInput').value;
      const savedPin = localStorage.getItem('vault_pin');
      if (input === savedPin) {
        document.getElementById('lockModal').style.display = 'none';
        document.getElementById('pinInput').value = '';
      } else {
        alert("Incorrect PIN!");
      }
    }

    function openSettings() { document.getElementById('settingsModal').style.display = 'flex'; }
    function closeSettings() { document.getElementById('settingsModal').style.display = 'none'; }

    function savePin() {
      const pin = document.getElementById('newPinInput').value;
      if (pin.length < 4) {
        alert("PIN must be at least 4 digits!");
        return;
      }
      localStorage.setItem('vault_pin', pin);
      alert("Security PIN saved successfully!");
      document.getElementById('newPinInput').value = '';
      closeSettings();
    }

    function removePin() {
      localStorage.removeItem('vault_pin');
      alert("Lock removed successfully!");
      closeSettings();
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.content-area').forEach(c => c.classList.remove('active'));
      
      if(tab === 'photo') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('photoTab').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('videoTab').classList.add('active');
      }
    }

    async function openCamera(mode) {
      currentMode = mode;
      document.getElementById('cameraModal').style.display = 'flex';
      setupCameraStream();
    }

    async function setupCameraStream() {
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
      }
      
      const captureBtn = document.getElementById('captureBtn');
      document.getElementById('recTimer').style.display = 'none';

      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          alert("Camera API is not supported in this WebView. Please check app permissions.");
          closeCameraModal();
          return;
        }

        mediaStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: facingMode, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: currentMode === 'video' ? { echoCancellation: true, noiseSuppression: true } : false
        });
        document.getElementById('camView').srcObject = mediaStream;

        if (currentMode === 'video') {
          captureBtn.innerText = "Start Recording";
          captureBtn.style.background = "#eab308";
          captureBtn.onclick = startVideoRecording;
        } else {
          captureBtn.innerText = "Capture Photo";
          captureBtn.style.background = "#22c55e";
          captureBtn.onclick = takeSnapshot;
        }
      } catch (err) {
        alert("Camera or Microphone permission denied or not allowed by app! Please allow camera permission in phone settings.");
        closeCameraModal();
      }
    }

    function flipCamera() {
      facingMode = (facingMode === 'user') ? 'environment' : 'user';
      setupCameraStream();
    }

    function closeCameraModal() {
      clearInterval(timerInterval);
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
      }
      document.getElementById('cameraModal').style.display = 'none';
      if(mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
      }
    }

    function takeSnapshot() {
      const video = document.getElementById('camView');
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth || 1280;
      canvas.height = video.videoHeight || 720;
      canvas.getContext('2d').drawImage(video, 0, 0);
      
      canvas.toBlob(blob => {
        saveFileToDB(blob, 'photo');
        closeCameraModal();
      }, 'image/jpeg', 0.95);
    }

    function startVideoRecording() {
      recordedChunks = [];
      secondsRecorded = 0;
      
      const timerElem = document.getElementById('recTimer');
      timerElem.style.display = 'block';
      timerElem.innerText = "🔴 00:00";

      timerInterval = setInterval(() => {
        secondsRecorded++;
        const mins = String(Math.floor(secondsRecorded / 60)).padStart(2, '0');
        const secs = String(secondsRecorded % 60).padStart(2, '0');
        timerElem.innerText = `🔴 ${mins}:${secs}`;
      }, 1000);

      try {
        mediaRecorder = new MediaRecorder(mediaStream, { mimeType: 'video/webm;codecs=vp8,opus' });
      } catch (e) {
        try {
          mediaRecorder = new MediaRecorder(mediaStream, { mimeType: 'video/mp4' });
        } catch (err) {
          mediaRecorder = new MediaRecorder(mediaStream);
        }
      }

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        clearInterval(timerInterval);
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        saveFileToDB(blob, 'video');
        closeCameraModal();
      };

      mediaRecorder.start();
      const captureBtn = document.getElementById('captureBtn');
      captureBtn.innerText = "Stop & Save Video";
      captureBtn.style.background = "#ef4444";
      captureBtn.onclick = () => mediaRecorder.stop();
    }

    function saveFileToDB(blob, type) {
      const transaction = db.transaction(["files"], "readwrite");
      const store = transaction.objectStore("files");
      const fileData = {
        blob: blob,
        type: type,
        date: new Date().toLocaleString()
      };
      
      store.add(fileData).onsuccess = () => loadStoredFiles();
    }

    function loadStoredFiles() {
      const transaction = db.transaction(["files"], "readonly");
      const store = transaction.objectStore("files");
      const request = store.getAll();

      request.onsuccess = () => {
        const files = request.result;
        const photoGrid = document.getElementById('photoGrid');
        const videoGrid = document.getElementById('videoGrid');
        
        photoGrid.innerHTML = '';
        videoGrid.innerHTML = '';

        files.reverse().forEach((file) => {
          const url = URL.createObjectURL(file.blob);
          const card = document.createElement('div');
          card.className = 'media-card';

          if (file.type === 'photo') {
            card.innerHTML = `
              <img src="${url}" class="media-preview" onclick="openFullView('${url}', 'photo')">
              <div class="media-info">
                <div class="media-name">Photo_${file.id}</div>
                <div class="media-size">${file.date}</div>
              </div>
              <div class="action-btns">
                <button class="btn-sm share-btn" onclick="shareMedia('${url}', 'photo_${file.id}.jpg', 'image/jpeg')">Share</button>
                <button class="btn-sm delete-btn" onclick="deleteFile(${file.id})">Delete</button>
              </div>
            `;
            photoGrid.appendChild(card);
          } else {
            card.innerHTML = `
              <video src="${url}" class="media-preview" onclick="openFullView('${url}', 'video')"></video>
              <div class="media-info">
                <div class="media-name">Video_${file.id}</div>
                <div class="media-size">${file.date}</div>
              </div>
              <div class="action-btns">
                <button class="btn-sm share-btn" onclick="shareMedia('${url}', 'video_${file.id}.webm', 'video/webm')">Share</button>
                <button class="btn-sm delete-btn" onclick="deleteFile(${file.id})">Delete</button>
              </div>
            `;
            videoGrid.appendChild(card);
          }
        });
      };
    }

    function openFullView(url, type) {
      const modal = document.getElementById('viewModal');
      const container = document.getElementById('viewContainer');
      modal.style.display = 'flex';

      if (type === 'photo') {
        container.innerHTML = `<img src="${url}" class="full-preview">`;
      } else {
        container.innerHTML = `<video src="${url}" class="full-preview" controls autoplay></video>`;
      }
    }

    function closeViewModal() {
      document.getElementById('viewModal').style.display = 'none';
      document.getElementById('viewContainer').innerHTML = '';
    }

    function deleteFile(id) {
      if (confirm("Are you sure you want to delete this file?")) {
        const transaction = db.transaction(["files"], "readwrite");
        const store = transaction.objectStore("files");
        store.delete(id).onsuccess = () => loadStoredFiles();
      }
    }

    // Direct Native Sharing (Messenger, WhatsApp, Telegram, etc.)
    async function shareMedia(url, filename, mimetype) {
      try {
        const response = await fetch(url);
        const blob = await response.blob();
        const file = new File([blob], filename, { type: mimetype });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({
            files: [file],
            title: 'Vault Pro Media',
            text: 'Shared from Vault Pro App by Muntashir Al Hera'
          });
        } else {
          const a = document.createElement('a');
          a.href = url;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          alert("Sharing not supported directly here. File downloaded to device storage.");
        }
      } catch (err) {
        console.log("Share action cancelled or failed.");
      }
    }
  </script>
</body>
</html>
